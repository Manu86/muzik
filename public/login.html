<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121212">
  <title>Connexion · Muzik</title>
  <link rel="icon" href="assets/icon-192.png?v=3">
  <style>
    :root {
      --bg: #121212;
      --bg-2: #181818;
      --border: #2a2a2a;
      --text: #e6e6e6;
      --muted: #9a9a9a;
      --accent: #27d397;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    form {
      background: #1e1e1e;
      border: 1px solid #2e2e2e;
      border-radius: 12px;
      padding: 2rem 2.2rem;
      width: min(360px, 92vw);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .6);
    }
    #logo { display: block; width: 72px; height: 72px; margin: 0 auto 1rem; border-radius: 16px; }
    h1 { margin: 0 0 .35rem; font-size: 1.35rem; text-align: center; }
    p.hint { color: var(--muted); margin: 0 0 1.25rem; font-size: .9rem; text-align: center; }
    label { display: block; font-weight: 600; margin: .9rem 0 .35rem; font-size: .92rem; }
    input {
      width: 100%; padding: .6rem .7rem; border-radius: 6px;
      border: 1px solid #3a3a3a; background: #141414; color: var(--text); font-size: 1rem;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #remember-wrap { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 1rem 0 0; color: var(--muted); cursor: pointer; }
    #remember-wrap span { font-size: .9rem; }
    #remember { width: auto; accent-color: var(--accent); }
    #error { color: #e5484d; font-size: .9rem; margin: .9rem 0 0; }
    button {
      width: 100%; margin-top: 1.5rem; padding: .75rem 1rem; font-size: 1rem;
      background: var(--accent); color: #082015; border: 0; border-radius: 8px;
      font-weight: 700; cursor: pointer;
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <form id="login-form" method="post" action="#">
    <img id="logo" src="assets/icon-192.png?v=3" alt="Muzik" width="72" height="72">
    <h1>Connexion</h1>
    <p class="hint">Cette bibliothèque est protégée par mot de passe.</p>
    <label for="user">Utilisateur</label>
    <input id="user" name="user" type="text" autocomplete="username" required autofocus>
    <label for="pass">Mot de passe</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required>
    <p id="error" role="alert" hidden></p>
    <label id="remember-wrap"><input id="remember" name="remember" type="checkbox" value="1"><span>Se souvenir de moi</span></label>
    <button type="submit">Se connecter</button>
  </form>

  <script>
    const form = document.getElementById('login-form');
    const error = document.getElementById('error');

    fetch('api/auth')
      .then(r => r.json())
      .then(d => { if (d.authenticated) location.replace('./'); })
      .catch(() => {});

    form.addEventListener('submit', async e => {
      e.preventDefault();
      error.hidden = true;
      try {
        const body = new URLSearchParams({
          user: document.getElementById('user').value.trim(),
          pass: document.getElementById('pass').value,
          remember: document.getElementById('remember').checked ? '1' : '0',
        });
        const r = await fetch('api/login', { method: 'POST', body });
        if (!r.ok) throw new Error('refusé');
        location.replace('./');
      } catch (err) {
        error.textContent = 'Connexion refusée : vérifiez vos identifiants.';
        error.hidden = false;
      }
    });
  </script>
</body>
</html>
