  <main id="content" tabindex="-1">
    <div id="topbar">
      <div id="search-box">
        <label for="search-input" id="search-label">Recherche</label>
        <div id="search-control">
          <input id="search-input" placeholder="Artiste, album, piste…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
          <button id="search-close" type="button" aria-label="Fermer la recherche" title="Fermer la recherche" hidden>&times;</button>
        </div>
        <div id="search-results" role="listbox" aria-label="Résultats de recherche"></div>
      </div>
    </div>
    <div id="views">
    <div id="view-home" class="view active"></div>
    <div id="view-genres" class="view"></div>
    <div id="view-genre-detail" class="view"></div>
    <div id="view-artists" class="view"></div>
    <div id="view-albums" class="view"></div>
    <div id="view-top" class="view"></div>
    <div id="view-recent" class="view"></div>
    <div id="view-random" class="view"></div>
    <div id="view-favorites" class="view"></div>
    <div id="view-settings" class="view"></div>
    <div id="view-album-detail" class="view"></div>
    <div id="view-artist-detail" class="view"></div>
    </div>
  </main>

  <div id="auth-screen" hidden>
    <form id="auth-form" method="post" action="#">
      <img id="auth-logo" src="assets/icon-192.png?v=3" alt="Muzik" width="72" height="72">
      <h2>Connexion</h2>
      <p id="auth-hint">Cette bibliothèque est protégée par mot de passe.</p>
      <label for="auth-user">Utilisateur</label>
      <input id="auth-user" name="user" type="text" autocomplete="username" required>
      <label for="auth-pass">Mot de passe</label>
      <input id="auth-pass" name="pass" type="password" autocomplete="current-password" required>
      <p id="auth-error" role="alert" hidden></p>
      <label id="auth-remember-wrap"><input id="auth-remember" name="remember" type="checkbox" value="1"><span>Se souvenir de moi</span></label>
      <button type="submit" class="auth-btn">Se connecter</button>
    </form>
  </div>

  <footer id="player">
    <div id="player-art"><img id="player-art-img" src="" alt=""><span id="player-art-note" aria-hidden="true">♪</span></div>
    <div id="player-info">
      <span id="player-title" role="status" aria-live="polite">Aucune piste</span>
      <span id="player-artist"></span>
    </div>
    <div id="player-controls">
      <button id="btn-prev" type="button" title="Précédente" aria-label="Piste précédente">⏮</button>
      <button id="btn-play" type="button" title="Lire" aria-label="Lecture"><svg id="ico-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg><svg id="ico-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true" style="display:none"><rect x="6" y="4" width="4" height="16" rx="1.5"></rect><rect x="14" y="4" width="4" height="16" rx="1.5"></rect></svg></button>
      <button id="btn-next" type="button" title="Suivante" aria-label="Piste suivante">⏭</button>
      <input id="player-progress" type="range" min="0" value="0" step="1" aria-label="Position de lecture">
      <span id="player-time">0:00</span>
      <button id="btn-shuffle" type="button" title="Aléatoire" aria-label="Lecture aléatoire" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg></button>
      <button id="btn-repeat" type="button" title="Répéter" aria-label="Répéter" aria-pressed="false"><svg id="ico-repeat-all" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg><svg id="ico-repeat-one" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path><text x="17.5" y="7.5" font-size="8" font-weight="700" fill="currentColor" stroke="none" text-anchor="middle">1</text></svg></button>
      <button id="btn-queue" type="button" title="File d'attente" aria-label="File d'attente" aria-pressed="false">🎶</button>
      <select id="player-transcode" title="Débit" aria-label="Débit de lecture">
        <option value="0">Direct</option>
        <option value="64">64k</option>
        <option value="128">128k</option>
        <option value="192">192k</option>
      </select>
    </div>
  </footer>

  <div id="queue-panel" role="region" aria-labelledby="queue-title" hidden>
    <div id="queue-head">
      <h3 id="queue-title">File d'attente</h3>
      <div class="queue-head-actions">
        <button id="queue-clear" type="button" title="Tout vider">🗑 Tout vider</button>
        <button id="queue-close" type="button" title="Fermer">Fermer</button>
      </div>
    </div>
    <div id="queue-list"></div>
  </div>

  <div id="art-lightbox" role="dialog" aria-modal="true" aria-label="Pochette agrandie" hidden>
    <button id="art-lightbox-close" type="button" title="Fermer" aria-label="Fermer">✕</button>
    <img id="art-lightbox-img" src="" alt="">
  </div>

  <script type="module" src="assets/js/app.js?v=77"></script>
